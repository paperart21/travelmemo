<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나의 여행일지</title>
<style>
:root{--paper:#f8f0e7;--ink:#4c4039;--line:#d8c5b6;--accent:#b54b45;--card:#fffaf5}
*{box-sizing:border-box}
body{margin:0;background:#eee6dd;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:760px;margin:auto;min-height:100vh;background:var(--paper);padding:24px 18px 48px}
h1{margin:0 0 18px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;font-size:36px}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
.small{font-size:13px;color:#796a61}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:#70594b;color:#fff}
.entry{margin-top:22px;border-bottom:1px solid var(--line);padding-bottom:28px}
.meta{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-bottom:14px}
.meta b{font-size:14px}.photos{border:1px solid var(--line);background:var(--card);padding:12px}
.photos img{display:block;width:100%;max-height:520px;object-fit:contain;background:#eadfd4;margin:0 auto 10px}
.memo{white-space:pre-wrap;line-height:1.75;font-size:17px;margin:15px 3px 0}
.empty{text-align:center;padding:50px 10px;color:#796a61}
.dialog{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;padding:18px;overflow:auto}
.dialog.show{display:block}.panel{max-width:700px;margin:25px auto;background:var(--paper);padding:20px;border-radius:14px}
.panel h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}
input,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fffaf5;color:var(--ink)}
textarea{height:150px;resize:vertical}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.cancel{background:#e5d6c8;color:var(--ink)}#preview img{width:100%;max-height:280px;object-fit:contain;margin:6px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#3d342f;color:#fff;padding:10px 15px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
@media(max-width:520px){main{padding:18px 12px 36px}h1{font-size:31px}.meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div><h1>나의 여행일지</h1><div class="small">기존 기록은 보존되고 새 기록이 계속 쌓입니다.</div></div>
    <button class="btn" id="addBtn">＋ 새 기록</button>
  </div>
  <div id="list"><div class="empty">여행 기록을 불러오는 중...</div></div>
</main>

<div class="dialog" id="dialog">
 <div class="panel">
  <h2>새 여행기록 추가</h2>
  <div class="field"><label>여행지</label><input id="destination" maxlength="60"></div>
  <div class="field"><label>날짜</label><input id="date" type="date"></div>
  <div class="field"><label>메모</label><textarea id="memo" maxlength="1000"></textarea></div>
  <div class="field"><label>사진 (최대 5장)</label><input id="photos" type="file" accept="image/*" multiple></div>
  <div id="preview"></div>
  <div class="field"><label>저장용 비밀번호</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="처음 설정한 비밀번호"></div>
  <div class="actions"><button class="btn cancel" id="cancelBtn">취소</button><button class="btn" id="saveBtn">기록 저장</button></div>
 </div>
</div>
<div class="toast" id="toast"></div>

const $=s=>document.querySelector(s);
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(entries){
 const all=[...entries,...INITIAL_ENTRIES].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 $('#list').innerHTML=all.length?all.map(e=>`<article class="entry">
  <div class="meta"><div><b>여행지:</b> ${esc(e.destination)}</div><div><b>날짜:</b> ${esc((e.date||'').replaceAll('-','.'))}</div></div>
  ${e.images?.length?`<div class="photos">${e.images.map(x=>`<img src="${x}" alt="여행 사진">`).join('')}</div>`:''}
  <div class="memo">${esc(e.memo||'')}</div>
 </article>`).join(''):'<div class="empty">아직 여행 기록이 없습니다.</div>';
}
async function load(){
 try{
   const r=await fetch('/.netlify/functions/entries');
   if(!r.ok) throw new Error();
   const data=await r.json(); render(data.entries||[]);
 }catch(e){render([]);toast('온라인 기록을 불러오지 못했습니다.');}
}
function compress(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader(); r.onerror=reject; r.onload=()=>{
   const im=new Image(); im.onerror=reject; im.onload=()=>{
    const max=1400,scale=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    resolve(c.toDataURL('image/jpeg',.76));
   }; im.src=r.result;
  }; r.readAsDataURL(file);
 });
}
$('#addBtn').onclick=()=>{$('#dialog').classList.add('show');if(!$('#date').value)$('#date').value=new Date().toISOString().slice(0,10)}
$('#cancelBtn').onclick=()=>$('#dialog').classList.remove('show');
$('#photos').onchange=async e=>{
 const files=[...e.target.files].slice(0,5);
 selectedImages=await Promise.all(files.map(compress));
 $('#preview').innerHTML=selectedImages.map(x=>`<img src="${x}">`).join('');
};
$('#saveBtn').onclick=async()=>{
 const destination=$('#destination').value.trim(),date=$('#date').value,memo=$('#memo').value,pin=$('#pin').value;
 if(!destination||!date){toast('여행지와 날짜를 입력해주세요.');return}
 if(!pin){toast('저장용 비밀번호를 입력해주세요.');return}
 const btn=$('#saveBtn');btn.disabled=true;btn.textContent='저장 중...';
 try{
  const r=await fetch('/.netlify/functions/entries',{method:'POST',headers:{'content-type':'application/json','x-diary-pin':pin},
   body:JSON.stringify({destination,date,memo,images:selectedImages})});
  const out=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(out.error||'저장 실패');
  $('#dialog').classList.remove('show'); $('#destination').value='';$('#memo').value='';$('#photos').value='';selectedImages=[];$('#preview').innerHTML='';
  toast('새 여행기록을 저장했습니다.'); await load();
 }catch(e){toast(e.message)}
 finally{btn.disabled=false;btn.textContent='기록 저장'}
};
load();
</script>
</body></html>
